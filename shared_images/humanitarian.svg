<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <!-- Fond -->
  <rect width="400" height="400" fill="#fff5f7"/>
  
  <!-- Cœur avec symbole humanitaire -->
  <path d="M 200 320 L 140 250 Q 130 220 150 200 Q 170 180 190 190 L 200 200 L 210 190 Q 230 180 250 200 Q 270 220 260 250 Z" fill="#ff6b6b" opacity="0.8"/>
  
  <!-- Croix humanitaire -->
  <rect x="185" y="220" width="30" height="8" fill="white"/>
  <rect x="192" y="213" width="8" height="22" fill="white"/>
  
  <!-- Figures symbolisant des personnes -->
  <circle cx="100" cy="100" r="12" fill="#667eea" opacity="0.7"/>
  <rect x="95" y="115" width="10" height="30" fill="#667eea" opacity="0.7"/>
  
  <circle cx="200" cy="80" r="12" fill="#667eea" opacity="0.7"/>
  <rect x="195" y="95" width="10" height="30" fill="#667eea" opacity="0.7"/>
  
  <circle cx="300" cy="100" r="12" fill="#667eea" opacity="0.7"/>
  <rect x="295" y="115" width="10" height="30" fill="#667eea" opacity="0.7"/>
  
  <!-- Élément de soutien -->
  <rect x="140" y="260" width="120" height="50" fill="#f0f4ff" stroke="#667eea" stroke-width="2" rx="8"/>
  <text x="200" y="278" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">Aide</text>
  <text x="200" y="296" text-anchor="middle" font-size="12" fill="#666">Humanitaire</text>
</svg>
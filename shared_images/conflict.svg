<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <!-- Fond -->
  <rect width="400" height="400" fill="#f0f4ff"/>
  
  <!-- Carte du Moyen-Orient stylisée -->
  <path d="M 150 100 L 250 120 L 260 180 L 220 200 L 180 190 L 140 170 Z" fill="#667eea" opacity="0.6" stroke="#764ba2" stroke-width="2"/>
  
  <!-- Iran en relief -->
  <circle cx="190" cy="150" r="35" fill="#ff6b6b" opacity="0.8"/>
  <text x="190" y="155" text-anchor="middle" font-size="20" font-weight="bold" fill="white">IRAN</text>
  
  <!-- Indicateurs géopolitiques -->
  <circle cx="120" cy="140" r="8" fill="#4ecdc4" opacity="0.7"/>
  <circle cx="260" cy="130" r="8" fill="#4ecdc4" opacity="0.7"/>
  <circle cx="240" cy="200" r="8" fill="#4ecdc4" opacity="0.7"/>
  
  <!-- Connexions -->
  <line x1="190" y1="150" x2="120" y2="140" stroke="#95e1d3" stroke-width="1" stroke-dasharray="5,5" opacity="0.6"/>
  <line x1="190" y1="150" x2="260" y2="130" stroke="#95e1d3" stroke-width="1" stroke-dasharray="5,5" opacity="0.6"/>
  <line x1="190" y1="150" x2="240" y2="200" stroke="#95e1d3" stroke-width="1" stroke-dasharray="5,5" opacity="0.6"/>
  
  <!-- Titre -->
  <text x="200" y="280" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">Géopolitique</text>
  <text x="200" y="300" text-anchor="middle" font-size="14" fill="#666">Moyen-Orient</text>
  
  <!-- Éléments décoratifs -->
  <circle cx="80" cy="340" r="6" fill="#667eea" opacity="0.5"/>
  <circle cx="320" cy="350" r="8" fill="#764ba2" opacity="0.5"/>
  <circle cx="100" cy="360" r="5" fill="#ff6b6b" opacity="0.4"/>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <!-- Fond -->
  <rect width="400" height="400" fill="#f5f0ff"/>
  
  <!-- Écran/Ciruits -->
  <rect x="100" y="80" width="200" height="150" fill="none" stroke="#667eea" stroke-width="3" rx="10"/>
  
  <!-- Écran avec code -->
  <rect x="110" y="90" width="180" height="130" fill="#1a1a2e" rx="5"/>
  <text x="130" y="120" font-size="10" fill="#00ff00" font-family="monospace">01010101</text>
  <text x="130" y="135" font-size="10" fill="#00ff00" font-family="monospace">11010110</text>
  <text x="130" y="150" font-size="10" fill="#00ff00" font-family="monospace">01110101</text>
  <text x="130" y="165" font-size="10" fill="#00ff00" font-family="monospace">10101011</text>
  <text x="130" y="180" font-size="10" fill="#00ff00" font-family="monospace">11001101</text>
  <text x="130" y="195" font-size="10" fill="#00ff00" font-family="monospace">01010110</text>
  
  <!-- Particules de sécurité -->
  <circle cx="90" cy="100" r="4" fill="#ff6b6b" opacity="0.6"/>
  <circle cx="310" cy="120" r="4" fill="#ff6b6b" opacity="0.6"/>
  <circle cx="85" cy="200" r="4" fill="#4ecdc4" opacity="0.6"/>
  <circle cx="320" cy="190" r="4" fill="#4ecdc4" opacity="0.6"/>
  
  <!-- Lignes de connexion -->
  <line x1="90" y1="100" x2="100" y2="110" stroke="#667eea" stroke-width="1" opacity="0.5"/>
  <line x1="310" y1="120" x2="300" y2="110" stroke="#667eea" stroke-width="1" opacity="0.5"/>
  
  <!-- Cadenas de sécurité -->
  <circle cx="200" cy="280" r="20" fill="none" stroke="#667eea" stroke-width="2"/>
  <path d="M 200 260 L 200 265 M 185 280 L 215 280 M 200 295 L 200 300" stroke="#667eea" stroke-width="2"/>
  
  <!-- Titre -->
  <text x="200" y="340" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">Cybersécurité</text>
  <text x="200" y="358" text-anchor="middle" font-size="12" fill="#666">Protection numérique</text>
</svg>
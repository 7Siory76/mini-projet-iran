<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <!-- Fond gradient -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:0.1" />
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#grad1)"/>
  
  <!-- Deux figures se serrant la main (diplomatie) -->
  <!-- Figure gauche -->
  <circle cx="120" cy="100" r="20" fill="#667eea"/>
  <rect x="110" y="120" width="20" height="40" fill="#667eea"/>
  <rect x="100" y="160" width="10" height="50" fill="#4a5fd0"/>
  <rect x="130" y="160" width="10" height="50" fill="#4a5fd0"/>
  
  <!-- Figure droite -->
  <circle cx="280" cy="100" r="20" fill="#764ba2"/>
  <rect x="270" y="120" width="20" height="40" fill="#764ba2"/>
  <rect x="260" y="160" width="10" height="50" fill="#6b3a8f"/>
  <rect x="290" y="160" width="10" height="50" fill="#6b3a8f"/>
  
  <!-- Poignée de main -->
  <line x1="150" y1="145" x2="250" y2="145" stroke="#ff6b6b" stroke-width="8" stroke-linecap="round"/>
  <circle cx="150" cy="145" r="6" fill="#ffb347"/>
  <circle cx="250" cy="145" r="6" fill="#ffb347"/>
  
  <!-- Symbole de dialogue -->
  <rect x="140" y="240" width="120" height="80" fill="none" stroke="#667eea" stroke-width="2" rx="10"/>
  <circle cx="155" cy="260" r="4" fill="#667eea"/>
  <circle cx="165" cy="260" r="4" fill="#667eea"/>
  <circle cx="175" cy="260" r="4" fill="#667eea"/>
  <text x="200" y="300" text-anchor="middle" font-size="12" fill="#333">Diplomatie</text>
  <text x="200" y="318" text-anchor="middle" font-size="12" fill="#666">Négociations</text>
</svg>
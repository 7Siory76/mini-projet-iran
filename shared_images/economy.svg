<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <!-- Fond -->
  <rect width="400" height="400" fill="#f0f8ff"/>
  
  <!-- Symbole d'économie (balance) -->
  <line x1="200" y1="80" x2="200" y2="140" stroke="#667eea" stroke-width="3"/>
  <circle cx="200" cy="80" r="8" fill="#667eea"/>
  
  <!-- Plateau gauche -->
  <rect x="150" y="135" width="80" height="8" fill="#667eea" opacity="0.7"/>
  <path d="M 160 135 L 155 170 L 225 170 L 240 135" fill="#ff6b6b" opacity="0.6" stroke="#ff5252" stroke-width="1"/>
  
  <!-- Plateau droit -->
  <rect x="170" y="135" width="80" height="8" fill="#667eea" opacity="0.7"/>
  <path d="M 180 135 L 175 170 L 245 170 L 260 135" fill="#4ecdc4" opacity="0.6" stroke="#31b3a0" stroke-width="1"/>
  
  <!-- Indicateurs économiques -->
  <text x="130" y="200" font-size="24" font-weight="bold" fill="#ff6b6b">📉</text>
  <text x="270" y="200" font-size="24" font-weight="bold" fill="#4ecdc4">📈</text>
  
  <!-- Graphique en bas -->
  <polyline points="100,280 150,260 200,290 250,240 300,270" fill="none" stroke="#667eea" stroke-width="2"/>
  <circle cx="100" cy="280" r="3" fill="#667eea"/>
  <circle cx="150" cy="260" r="3" fill="#667eea"/>
  <circle cx="200" cy="290" r="3" fill="#667eea"/>
  <circle cx="250" cy="240" r="3" fill="#667eea"/>
  <circle cx="300" cy="270" r="3" fill="#667eea"/>
  
  <!-- Titre -->
  <text x="200" y="350" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">Économie</text>
  <text x="200" y="368" text-anchor="middle" font-size="12" fill="#666">Impacts</text>
</svg>
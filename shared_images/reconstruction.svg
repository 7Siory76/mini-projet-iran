<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <!-- Fond -->
  <rect width="400" height="400" fill="#f0fff0"/>
  
  <!-- Bâtiments en reconstruction -->
  <!-- Bâtiment 1 (endommagé) -->
  <rect x="80" y="180" width="40" height="90" fill="#ddd" stroke="#999" stroke-width="2"/>
  <rect x="85" y="185" width="12" height="12" fill="#ccc" stroke="#999" stroke-width="1"/>
  <rect x="103" y="185" width="12" height="12" fill="#ccc" stroke="#999" stroke-width="1"/>
  <rect x="85" y="205" width="12" height="12" fill="#ccc" stroke="#999" stroke-width="1"/>
  <rect x="103" y="205" width="12" height="12" fill="#ccc" stroke="#999" stroke-width="1"/>
  
  <!-- Grue de construction -->
  <line x1="140" y1="100" x2="140" y2="180" stroke="#ff6b6b" stroke-width="4"/>
  <line x1="140" y1="120" x2="180" y2="140" stroke="#ff6b6b" stroke-width="3"/>
  <circle cx="140" cy="100" r="8" fill="#ff6b6b"/>
  
  <!-- Bâtiment 2 (en construction) -->
  <rect x="190" y="200" width="40" height="70" fill="#ffd700" opacity="0.6" stroke="#ff8c00" stroke-width="2" stroke-dasharray="5,5"/>
  <rect x="195" y="210" width="10" height="10" fill="#fff" stroke="#ff8c00" stroke-width="1"/>
  <rect x="210" y="210" width="10" height="10" fill="#fff" stroke="#ff8c00" stroke-width="1"/>
  
  <!-- Bâtiment 3 (reconstruit) -->
  <rect x="280" y="180" width="40" height="90" fill="#4ecdc4" stroke="#31b3a0" stroke-width="2"/>
  <rect x="285" y="185" width="12" height="12" fill="#67e8dd" stroke="#31b3a0" stroke-width="1"/>
  <rect x="303" y="185" width="12" height="12" fill="#67e8dd" stroke="#31b3a0" stroke-width="1"/>
  <rect x="285" y="205" width="12" height="12" fill="#67e8dd" stroke="#31b3a0" stroke-width="1"/>
  <rect x="303" y="205" width="12" height="12" fill="#67e8dd" stroke="#31b3a0" stroke-width="1"/>
  <path d="M 280 180 L 300 160 L 320 180" fill="#4ecdc4" stroke="#31b3a0" stroke-width="2"/>
  
  <!-- Sol -->
  <line x1="50" y1="270" x2="350" y2="270" stroke="#999" stroke-width="3"/>
  
  <!-- Titre -->
  <text x="200" y="310" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">Reconstruction</text>
  <text x="200" y="328" text-anchor="middle" font-size="12" fill="#666">Vers la stabilité</text>
</svg>
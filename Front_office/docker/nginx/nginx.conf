user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 20M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript 
               application/x-javascript application/xml+rss 
               application/json image/svg+xml;

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # Cache pour les assets statiques
        location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        # Route pour les détails articles (format YYYY/MM/DD/slug)
        location ~ ^/\d{4}/\d{2}/\d{2}/[a-z0-9-]+/?$ {
            rewrite ^(.*)$ /detail.html last;
        }

        # Route pour les détails articles (ancien format /actualite/slug)
        location ~ ^/actualite/[a-z0-9-]+/?$ {
            rewrite ^(.*)$ /detail.html last;
        }

        # Redirection pour SPA (Single Page App)
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Interdire l'accès aux fichiers sensibles
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }

        # Gestion des erreurs
        error_page 404 /index.html;
    }
}

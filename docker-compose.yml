services:
  # ============================
  # BACK OFFICE - API + Database
  # ============================
  backoffice_app:
    build:
      context: ./Back_office
      dockerfile: docker/php-apache/Dockerfile
    container_name: backoffice_app
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./Back_office/app:/var/www/html
    depends_on:
      - backoffice_db
    environment:
      DB_HOST: backoffice_db
      DB_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-backoffice_db}
      POSTGRES_USER: ${POSTGRES_USER:-backoffice_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-backoffice_pass}
    networks:
      - iran_network

  backoffice_db:
    image: postgres:16-alpine
    container_name: backoffice_db
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-backoffice_db}
      POSTGRES_USER: ${POSTGRES_USER:-backoffice_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-backoffice_pass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./Back_office/database/init:/docker-entrypoint-initdb.d
    networks:
      - iran_network

  # ============================
  # FRONT OFFICE - Website
  # ============================
  frontoffice_web:
    build:
      context: ./Front_office
      dockerfile: docker/php-apache/Dockerfile
    container_name: frontoffice_web
    ports:
      - "${FRONT_PORT:-3000}:80"
    volumes:
      - ./Front_office:/var/www/html
    restart: unless-stopped
    depends_on:
      - backoffice_app
    environment:
      FRONT_PORT: ${FRONT_PORT:-3000}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DB_HOST: backoffice_db
      DB_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-backoffice_db}
      POSTGRES_USER: ${POSTGRES_USER:-backoffice_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-backoffice_pass}
    networks:
      - iran_network

networks:
  iran_network:
    driver: bridge

volumes:
  postgres_data:
